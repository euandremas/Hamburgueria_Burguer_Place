<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Burger Place Admin</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/login.css" />
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">

</head>

<body>
  <main class="login-wrapper">
    <header class="login-header">
      <div class="login-logo" aria-hidden="true">🍔</div>
      <h1>Burger Place Admin</h1>
      <p>Sistema de Gestão de Hamburgueria</p>
    </header>

    <section class="login-card" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Acesso Administrativo</h2>

      <div id="alert" class="alert is-hidden" aria-live="polite"></div>

      <form id="loginForm" class="form" autocomplete="on">
      <label class="field" for="username">
  <span>Usuário</span>
  <input
    id="username"
    name="username"
    type="text"
    placeholder="admin"
    autocomplete="username"
    autocapitalize="none"
    spellcheck="false"
    required
  />
</label>

        <label class="field" for="password">
          <span>Senha</span>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            minlength="4"
            required
          />
        </label>

        <button class="btn btn--primary btn-login" type="submit">
          Entrar
        </button>
      </form>

      <p class="login-hint">Use o usuário admin e a senha cadastrada para acessar</p>
    </section>

    <footer class="login-footer">
      © 2025 Burger Place Admin. Todos os direitos reservados.
    </footer>
  </main>

  <script src="./js/ui.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script>
  Auth.redirectIfLoggedIn();
</script>
<script src="./js/pwa.js"></script>
